<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Jukebox Moods icon: an original, generic arched jukebox -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#1d2433"/>
  <!-- cabinet -->
  <path d="M58 220 V112 A70 70 0 0 1 198 112 V220 Z" fill="#d9662b"/>
  <!-- neon tube following the arch -->
  <path d="M70 220 V112 A58 58 0 0 1 186 112 V220" fill="none" stroke="#ffd25a" stroke-width="7" stroke-linecap="round"/>
  <!-- glass window -->
  <path d="M86 140 V112 A42 42 0 0 1 170 112 V140 Z" fill="#fff1c9"/>
  <!-- record -->
  <circle cx="128" cy="116" r="27" fill="#222"/>
  <circle cx="128" cy="116" r="19" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="128" cy="116" r="8" fill="#e8463c"/>
  <circle cx="128" cy="116" r="2" fill="#fff1c9"/>
  <!-- speaker grille -->
  <rect x="88" y="152" width="80" height="54" rx="10" fill="#7d2f14"/>
  <g stroke="#ffb347" stroke-width="5" stroke-linecap="round">
    <line x1="104" y1="162" x2="104" y2="196"/>
    <line x1="120" y1="162" x2="120" y2="196"/>
    <line x1="136" y1="162" x2="136" y2="196"/>
    <line x1="152" y1="162" x2="152" y2="196"/>
  </g>
  <!-- base -->
  <rect x="50" y="214" width="156" height="16" rx="7" fill="#9b4219"/>
</svg>
